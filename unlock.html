<!DOCTYPE html>
<html lang="en">
<head>
    <title>Unlock Our Journey ❤️</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css?family=Dancing+Script|Lobster|Pattaya|Srisakdi&display=swap" rel="stylesheet">

    <style>
        :root {
            --pink-primary: #ef6a8a;
            --pink-soft: #f99ec7;
            --pink-hover: #f04c74;
            --ink: #283a44;
            --accent: #a81723;
        }

        body {
            margin: 0;
            background: linear-gradient(180deg, #fde6ef 0%, #fff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
            font-family: 'Srisakdi', cursive;
        }

        /* Floating hearts background */
        .hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            color: rgba(239, 106, 138, 0.5);
            font-size: 18px;
            animation: floatUp 10s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.8); opacity: 0; }
            20% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        .unlock-box {
            background: white;
            padding: 60px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(239,106,138,0.12);
            border-top: 6px solid var(--pink-soft);
            max-width: 520px;
            position: relative;
            z-index: 2;
            transition: opacity 1s ease;
        }

        .unlock-title {
            font-family: 'Lobster', cursive;
            font-size: 34px;
            color: var(--ink);
            margin-bottom: 25px;
        }

        .riddle {
            font-size: 20px;
            color: var(--ink);
            min-height: 80px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 25px;
            border: 2px solid var(--pink-primary);
            font-size: 18px;
            text-align: center;
            outline: none;
            color: var(--ink);
            font-family: 'Srisakdi', cursive;
        }

        input:focus {
            border-color: var(--pink-primary);
            box-shadow: 0 0 0 4px rgba(239, 106, 138, 0.15);
        }

        button {
            margin-top: 25px;
            padding: 12px 35px;
            border-radius: 30px;
            border: none;
            background: var(--pink-primary);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Pattaya', sans-serif;
        }

        button:hover {
            background: var(--pink-hover);
        }

        .error {
            margin-top: 15px;
            color: var(--accent);
            font-size: 18px;
        }

        /* Shake animation */
        .shake {
            animation: shake 0.4s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-6px); }
            100% { transform: translateX(0); }
        }

        /* Glow effect */
        .glow {
            box-shadow: 0 0 30px rgba(239,106,138,0.6);
        }

        .fade-out {
            opacity: 0;
        }

        .effects {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 3;
        }

        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.95);
            animation: sparklePop 900ms ease-out forwards;
        }

        @keyframes sparklePop {
            0% {
                transform: translate(0, 0) scale(0.4);
                opacity: 0;
            }
            25% { opacity: 1; }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(1.1);
                opacity: 0;
            }
        }

        .burst-heart {
            position: absolute;
            font-size: 22px;
            color: var(--pink-primary);
            text-shadow: 0 0 10px rgba(239, 106, 138, 0.4);
            animation: burstHeart 1200ms cubic-bezier(.2,.8,.2,1) forwards;
        }

        @keyframes burstHeart {
            0% {
                transform: translate(0, 0) scale(0.7);
                opacity: 0;
            }
            15% { opacity: 1; }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(1.25);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

<div class="hearts" id="hearts"></div>
<div class="effects" id="effects"></div>

<div class="unlock-box" id="unlockBox">
    <div class="unlock-title">Before We Begin ❤️</div>
    <div class="riddle" id="typedText"></div>

    <input type="text" id="answer">
    <button onclick="checkAnswer()">Unlock</button>

    <div class="error" id="errorMsg"></div>
</div>

<!-- Heartbeat Sound -->
<audio id="heartbeatAudio" loop preload="auto">
    <source src="audio/heartbeat.mp3" type="audio/mpeg">
</audio>

<script>

/* Typing Effect */
const text = `When the sun goes down
And the evening feels slow,
Where would we sit close and cozy,
Where soft breezes blow?`;
let index = 0;

function typeEffect() {
    if (index < text.length) {
        document.getElementById("typedText").innerHTML += text.charAt(index);
        index++;
        setTimeout(typeEffect, 35);
    }
}
typeEffect();

/* Floating Hearts Generator */
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = 8 + Math.random() * 5 + "s";
    document.getElementById("hearts").appendChild(heart);

    setTimeout(() => heart.remove(), 12000);
}
setInterval(createHeart, 500);

/* Real Heartbeat MP3 */
let heartbeatStarted = false;
const heartbeatAudio = document.getElementById("heartbeatAudio");
const answerInput = document.getElementById("answer");

function startHeartbeat() {
    if (heartbeatStarted) return;
    heartbeatStarted = true;
    heartbeatAudio.volume = 0.3;
    heartbeatAudio.play().catch(() => {
        heartbeatStarted = false;
    });
}

["focus", "click"].forEach((evt) => {
    answerInput.addEventListener(evt, startHeartbeat);
});

/* Sparkles + Burst Hearts on unlock */
function launchSparkles(x, y, count) {
    const layer = document.getElementById("effects");
    for (let i = 0; i < count; i++) {
        const s = document.createElement("span");
        s.className = "sparkle";
        s.style.left = `${x}px`;
        s.style.top = `${y}px`;
        s.style.background = i % 2 ? "#fff" : "#ffd7e5";
        s.style.setProperty("--dx", `${(Math.random() - 0.5) * 240}px`);
        s.style.setProperty("--dy", `${(Math.random() - 0.5) * 180}px`);
        layer.appendChild(s);
        setTimeout(() => s.remove(), 950);
    }
}

function burstHearts(x, y, count) {
    const layer = document.getElementById("effects");
    for (let i = 0; i < count; i++) {
        const h = document.createElement("span");
        h.className = "burst-heart";
        h.textContent = "❤";
        h.style.left = `${x}px`;
        h.style.top = `${y}px`;
        h.style.setProperty("--dx", `${(Math.random() - 0.5) * 320}px`);
        h.style.setProperty("--dy", `${-80 - Math.random() * 260}px`);
        layer.appendChild(h);
        setTimeout(() => h.remove(), 1250);
    }
}

/* Check Answer */
function checkAnswer() {
    const correctAnswer = "meghdoot";
    const userAnswer = document.getElementById("answer").value.trim().toLowerCase();
    const box = document.getElementById("unlockBox");

    if (userAnswer === correctAnswer) {

        box.classList.add("glow");
        document.getElementById("errorMsg").innerText = "";

        const rect = box.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        launchSparkles(cx, cy, 26);
        burstHearts(cx, cy + 20, 30);
        startHeartbeat();

        // Fade heartbeat out after the initial "lub-dub" moment.
        setTimeout(() => {
            const fadeTimer = setInterval(() => {
                heartbeatAudio.volume = Math.max(0, heartbeatAudio.volume - 0.06);
                if (heartbeatAudio.volume <= 0.01) {
                    clearInterval(fadeTimer);
                    heartbeatAudio.pause();
                    heartbeatAudio.currentTime = 0;
                    heartbeatAudio.volume = 0.45;
                }
            }, 70);
        }, 550);

        setTimeout(() => {
            box.classList.add("fade-out");
        }, 800);

        setTimeout(() => {
            sessionStorage.setItem("unlocked", "true");
            sessionStorage.setItem("autoplayMainMusic", "true");
            window.location.href = "index.html";
        }, 1700);

    } else {

        box.classList.add("shake");
        document.getElementById("errorMsg").innerText =
            "Hmm... try remembering more carefully ❤️";

        setTimeout(() => {
            box.classList.remove("shake");
        }, 400);
    }
}

</script>

</body>
</html>
